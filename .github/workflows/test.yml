name: Test

on:
  pull_request:
    paths:
      - 'app/**'
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: |
      github.head_ref != 'docs' &&
      !(startsWith(github.head_ref, 'dev-') && github.base_ref == 'develop') &&
      !(github.head_ref == 'develop' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run unit tests with coverage
        working-directory: app
        run: |
          go test -coverprofile=coverage.out -covermode=atomic \
            ./src/cmd/... ./src/config/... ./src/core/... ./src/infra/... ./src/utils/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage.out
          flags: unit
          fail_ci_if_error: false
          verbose: true

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: |
      github.head_ref != 'docs' &&
      !(startsWith(github.head_ref, 'dev-') && github.base_ref == 'develop') &&
      !(github.head_ref == 'develop' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run E2E tests
        working-directory: app
        run: go test -v ./src/e2e/...
