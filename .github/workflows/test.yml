name: Test

# paths allowlist: docs-only (and other non-app) changes do not run this workflow.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/test.yml"

# Cancel in-progress runs for the same PR; push uses commit SHA (no PR duplicate on main-only push).
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: |
      github.head_ref != 'docs' &&
      !(startsWith(github.head_ref, 'dev-') && github.base_ref == 'develop') &&
      !(github.head_ref == 'develop' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run unit tests with coverage
        working-directory: app
        run: |
          go test -coverprofile=coverage.out -covermode=atomic \
            ./src/cmd/... ./src/config/... ./src/core/... ./src/infra/... ./src/utils/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage.out
          flags: unit
          fail_ci_if_error: false
          verbose: true

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: |
      github.head_ref != 'docs' &&
      !(startsWith(github.head_ref, 'dev-') && github.base_ref == 'develop') &&
      !(github.head_ref == 'develop' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Run E2E tests
        working-directory: app
        run: go test -v ./src/e2e/...
