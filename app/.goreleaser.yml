version: 2

project_name: bwsf

before:
  hooks:
    - go mod tidy

builds:
  - main: ./src/main.go
    binary: bwsf
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  # Latest formula (brew install bwsf)
  - repository:
      owner: b4m-oss
      name: tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/b4m-oss/bwsf
    description: CLI tool to manage .env files with Bitwarden
    license: MIT
    install: |
      bin.install "bwsf"
    test: |
      system "#{bin}/bwsf", "--help"

  # Versioned formula (brew install bwsf@x.y.z) — keeps prior releases installable
  - name: "bwsf@{{ .Version }}"
    repository:
      owner: b4m-oss
      name: tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/b4m-oss/bwsf
    description: CLI tool to manage .env files with Bitwarden
    license: MIT
    custom_block: |
      keg_only :versioned_formula
    install: |
      bin.install "bwsf"
    test: |
      system "#{bin}/bwsf", "--help"
